<!DOCTYPE html>
<html class="no-js" lang="bn">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>পাসওয়ার্ড রিসেট :: Press Studio</title>
    <link href="/assets/img/favicon.png" rel="icon">
    <meta name="theme-color" content="#00194c">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
    </style>
</head>
<body>
    <header class="techtaranga_header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-4 col-lg-3">
                    <a href="/"><img class="techtaranga-logo" src="/assets/img/logo.png" alt="Press Studio"></a>
                </div>
                <div class="col-8 col-lg-9 text-end">
                    <a href="/login.html" class="nav-auth-link">লগইন</a>
                </div> 
            </div>
        </div>
    </header>

    <section class="py-5 bg-light techtaranga_auth_form">
        <div class="container" style="margin-top: 80px;">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="techtaranga_login_form card border-0 shadow-lg rounded-4 overflow-hidden">
                        <div class="card-header bg-white border-0 pt-4 text-center">
                            <h3 class="fw-bold" style="color: var(--tt_primary_color);">পাসওয়ার্ড ভুলে গেছেন?</h3>
                            <p class="text-muted">আপনার ইমেইল দিন, আমরা রিসেট লিঙ্ক পাঠাব</p>
                        </div>
                        <div class="card-body p-4">
                            <div id="resetAlert"></div>
                            
                            <form id="resetForm">
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">আপনার ইমেইল ঠিকানা</label>
                                    <input type="email" id="resetEmail" class="form-control form-control-lg bg-light border-0" placeholder="example@mail.com" required>
                                </div>
                                <button type="submit" class="techtaranga-button w-100 border-0 py-3 rounded-pill fw-bold">লিঙ্ক সেন্ড করুন <i class="fas fa-paper-plane ms-2"></i></button>
                            </form>

                            <div class="text-center mt-4">
                                <a href="/login.html" class="text-decoration-none fw-bold" style="color: #fc5b11;"><i class="fas fa-arrow-left me-1"></i> লগইন পেইজে ফিরে যান</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var email = document.getElementById('resetEmail').value.trim();
            document.getElementById('resetAlert').innerHTML = '<div class="alert alert-success border-0 rounded-3 shadow-sm"><i class="fas fa-check-circle me-2"></i> পাসওয়ার্ড রিসেটের লিঙ্ক আপনার ইমেইলে (' + email + ') পাঠানো হয়েছে। অনুগ্রহ করে ইনবক্স চেক করুন।</div>';
        });
    </script>
</body>
</html>
