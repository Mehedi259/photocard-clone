    <link href="/assets/img/favicon.png" rel="icon">

    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        body { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
        .techtaranga_login_form {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 25, 76, 0.12);
        }
        .btn-demo-login {
            background: linear-gradient(135deg, #00194c, #004dc7);
            color: #ffffff;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 50rem;
            transition: all 0.3s ease;
        }
        .btn-demo-login:hover {
            opacity: 0.95;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 77, 199, 0.3);
        }
    </style>
</head>
<body>
    <header class="techtaranga_header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-4 col-lg-3">
                    <a href="/"><img class="techtaranga-logo" src="/assets/img/logo.png" alt="Press Studio"></a>
                </div>
                <div class="col-4 col-lg-6 d-none d-lg-block">
                    <ul class="nav-menu justify-content-center"> 
                        <li><a href="/#home" class="nav-link">হোম</a></li>   
                        <li><a href="/#features" class="nav-link">ফিচার্স</a></li>
                        <li><a href="/#pricing" class="nav-link">প্রাইসিং</a></li> 
                    </ul>
                </div>
                <div class="col-8 col-lg-3 text-end">
                    <div class="header-action-btns d-none d-lg-flex align-items-center justify-content-end gap-3">
                        <a href="/login.html" class="nav-auth-link active">লগইন</a>
                        <a class="techtaranga-button" href="/register.html">অর্ডার করুণ</a>
                    </div>
                    <button class="mobile-menu-toggle d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
                        <i class="fas fa-bars"></i>
                    </button>
                </div> 
            </div>
        </div>
    </header>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileMenu">
        <div class="offcanvas-header">
            <img src="/assets/img/logo-white.png" alt="Press Studio" class="offcanvas-logo">
            <button type="button" class="btn-close bg-white rounded-circle" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="mobile-nav-menu">
                <li><a href="/#home" class="nav-link">হোম</a></li> 
                <li><a href="/#features" class="nav-link">ফিচার্স</a></li>
                <li><a href="/#pricing" class="nav-link">প্রাইসিং</a></li>
                <li><a href="/login.html" class="nav-link active">লগইন</a></li>
                <li><a href="/register.html" class="nav-link">রেজিস্ট্রেশন</a></li>
            </ul>
        </div>
    </div>

    <section class="py-5 bg-light techtaranga_auth_form">
        <div class="container" style="margin-top: 80px;">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="techtaranga_login_form card border-0 shadow-lg rounded-4 overflow-hidden">
                        <div class="login_info"> 
                            <div class="card-header bg-white border-0 pt-4 text-center">
                                <h3 class="fw-bold" style="color: var(--tt_primary_color);">লগইন করুন</h3>
                                <p class="text-muted">আপনার অ্যাকাউন্টে প্রবেশ করতে তথ্য দিন</p>
                            </div>
                            <div class="card-body p-4">
                                <div id="loginAlert"></div>
                                
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">ইমেইল ঠিকানা</label>
                                        <input type="email" id="loginEmail" class="form-control-lg form-control rounded-pill" placeholder="example@mail.com" value="helloprobash@gmail.com" required>
                                    </div>
                                    <div class="mb-4">
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <label class="form-label fw-semibold mb-0">পাসওয়ার্ড</label>
                                            <a href="/forgot-password.html" class="small text-decoration-none fw-bold" style="color: #fc5b11;">পাসওয়ার্ড ভুলে গেছেন?</a>
                                        </div>
                                        <input type="password" id="loginPassword" class="form-control-lg form-control rounded-pill" placeholder="আপনার পাসওয়ার্ড" value="ProkashTv017" required>
                                    </div>
                                    <button type="submit" class="techtaranga-button w-100 border-0 py-3">লগইন করুন</button>
                                </form>

                                <div class="mt-3">
                                    <button type="button" id="demoLoginBtn" class="btn-demo-login w-100 text-center">
                                        <i class="fas fa-bolt me-2 text-warning"></i> এক ক্লিকে ডেমো অ্যাকাউন্টে প্রবেশ (Prokash Tv)
                                    </button>
                                </div>

                                <div class="divider my-4">
                                    <span class="text-muted">নতুন ইউজার?</span>
                                </div> 
                                <a href="/register.html" class="btn rounded-pill text-center w-100" style="color: #fc5b11; border: 2px solid; padding: 10px; font-weight: bold;">রেজিস্ট্রেশন করুন</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="techtaranga_footer">
        <div class="footer-bottom text-center">
            <div class="container">
                <p class="mb-0 text-white-50">© 2026 Press Studio | A Brand of Tech Taranga</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function doLogin(email, name) {
            var existing = null;
            try { existing = JSON.parse(localStorage.getItem('ps_user')); } catch(e){}
            
            var profile = existing || {
                name: name || 'Prokash Tv',
                brand_name: 'Hello Probash',
                email: email || 'helloprobash@gmail.com',
                mobile: '01728891961',
                website: 'WWW.HELLOPROBASH.COM',
                fb: 'Hello Probash',
                youtube: 'Hello Probash',
                logo: '/assets/img/default-logo.png',
                plan: 'Premium',
                days_left: 45,
                total_downloads: 1285,
                month_downloads: 58,
                favorites: ['2823', '2630']
            };
            if (email) profile.email = email;
            if (name) profile.name = name;

            localStorage.setItem('ps_user', JSON.stringify(profile));
            
            var alertEl = document.getElementById('loginAlert');
            alertEl.innerHTML = '<div class="alert alert-success border-0 rounded-3 shadow-sm"><i class="fas fa-check-circle me-2"></i> লগইন সফল হয়েছে! ড্যাশবোর্ডে নিয়ে যাওয়া হচ্ছে...</div>';
            setTimeout(function() {
                window.location.href = '/account/index.html';
            }, 600);
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var email = document.getElementById('loginEmail').value.trim();
            var pass = document.getElementById('loginPassword').value.trim();
            if (!email || !pass) return;
            doLogin(email, 'Prokash Tv');
        });

        document.getElementById('demoLoginBtn').addEventListener('click', function() {
            doLogin('helloprobash@gmail.com', 'Prokash Tv');
        });
    </script>
</body>
</html>
